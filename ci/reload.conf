# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_STREAM  directives for a stream block, may be empty
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# The backend here is deliberately NOT listening.  That is the condition
# upstream issue #194 reports: with a backend the checker cannot reach,
# three or more reloads in a row were said to take the master down with
# them.  A reload with everything healthy would not go near that, so the
# peer stays dead for the whole run and every round reloads a server whose
# checker is actively failing against it.
#
# The module keeps its peers in a shared memory zone, and a zone is exactly
# what a reload can lose: name and size have to match the previous cycle
# for nginx to carry it over.  The status page reads that zone, so a reload
# that dropped it, or that left the peer array pointing into the old one,
# stops naming the peer.  The probe asks for the one thing only a live zone
# can produce.

RELOAD_STREAM=""

RELOAD_HTTP="
    upstream reload_backends {
        server 127.0.0.1:19102;
        check interval=500 rise=1 fall=1 timeout=500 type=http;
        check_http_send \"HEAD / HTTP/1.0\\r\\n\\r\\n\";
        check_http_expect_alive http_2xx http_3xx;
    }"

RELOAD_SERVER="
        location /probe {
            check_status;
        }"

RELOAD_EXPECT='127.0.0.1:19102'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe?format=json" |
		sed -n 's/.*\(127\.0\.0\.1:19102\).*/\1/p'
}
