name: FreeBSD

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: build and test in a virtual machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # every other workflow measures Linux, and the port this module is
    # packaged in is a FreeBSD one

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the suite in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '14'
          prepare: |
            # curl is not in the FreeBSD base system, ci/tcpcheck.sh needs it
            pkg install -y git pcre2 curl p5-Test-Nginx
          run: |
            . .github/versions.env
            # Keep the build and gate scratch out of the workspace: this
            # action rsyncs the workspace back when the job ends, and a
            # tree with a shutting down nginx in it fails that rsync with
            # "file has vanished".  Nothing in there is wanted afterwards.
            export CI_WORK=$HOME/ci-work
            ci/build.sh "$NGINX_VERSION" "$HOME/nginx"
            # the job runs as root, and Test::Nginx then writes "user
            # root;" into its configuration.  root has no group of that
            # name here, it is in wheel
            TEST_NGINX_WORKER_USER='root wheel' \
              TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/
            # The gate reads /proc for the descriptor count and skips that
            # one assertion where there is no /proc, which is here.
            ci/tcpcheck.sh "$HOME/nginx/sbin/nginx"
